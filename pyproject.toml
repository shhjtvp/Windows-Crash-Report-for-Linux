[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crash-simulator"
dynamic = ["version"]
description = "⚠️ [傻逼项目] 模拟 Windows 错误报告弹窗。仅供学习研究，可能触发杀毒软件误报或影响系统稳定性，请勿在生产环境使用！"
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Your Name", email = "you@example.com"},
]
keywords = ["crash", "simulator", "windows", "gui", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]

# 核心依赖（仅监控功能必需）
dependencies = [
    "psutil>=5.9.0",
]

# 可选依赖组
[project.optional-dependencies]
gui = ["PyQt5>=5.15.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.5",
    "psutil-stubs>=0.1",
]

# CLI 入口点
[project.scripts]
crash-sim = "crash_simulator.main:main"

# 动态版本从 __init__.py 读取
[tool.setuptools.dynamic]
version = {attr = "crash_simulator.__version__"}

# 包发现配置（适配 src layout）
[tool.setuptools.packages.find]
where = ["src"]

# 包含静态资源文件
[tool.setuptools.package-data]
crash_simulator = ["locales/*.json", "assets/*.png", "assets/*.qss"]

# Ruff 代码检查配置
[tool.ruff]
target-version = "py38"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]

# MyPy 类型检查配置
[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true